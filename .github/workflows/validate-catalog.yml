name: Validate exercise catalog

on:
  pull_request:
    paths: ['catalog/**', 'assets/catalog/**']
  push:
    branches: [main]
    paths: ['catalog/**', 'assets/catalog/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/validate_catalog.py
